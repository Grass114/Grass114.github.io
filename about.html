<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>关于我 · BlueCat114</title>
    <style>
        /* ===== 颜色变量 ===== */
        :root {
            --theme-color: #6c63ff;
            --theme-color-rgb: 108, 99, 255;

            --bg-start: #f5f9ff;
            --bg-end: #e6edf7;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-primary: #0b1e33;
            --text-secondary: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --shadow-color: rgba(0, 20, 40, 0.08);
            --shadow-hover: rgba(0, 20, 40, 0.12);
            --topbar-bg: rgba(255, 255, 255, 0.6);
            --topbar-border: rgba(255, 255, 255, 0.8);
            --footer-border: rgba(255, 255, 255, 0.6);
            --link-color: var(--theme-color, #6c63ff);
            --link-hover: var(--theme-color, #4a42b8);
            --clock-color: var(--text-muted);
        }

        [data-theme="dark"] {
            --bg-start: #0f1724;
            --bg-end: #1a2332;
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-border: rgba(71, 85, 105, 0.5);
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --text-light: #64748b;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.4);
            --topbar-bg: rgba(15, 23, 36, 0.8);
            --topbar-border: rgba(71, 85, 105, 0.5);
            --footer-border: rgba(71, 85, 105, 0.4);
            --link-color: var(--theme-color, #818cf8);
            --link-hover: var(--theme-color, #a5b4fc);
            --clock-color: #94a3b8;
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
            color: var(--text-primary);
        }

        /* ===== 导航条 ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            padding: 12px 28px;
            background: #ffffff;
            border-bottom: 1px solid #e9edf2;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        [data-theme="dark"] .top-bar {
            background: #1a2332;
            border-bottom: 1px solid #2a3a4a;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar .site-title {
            font-size: 18px;
            font-weight: 600;
            color: #0b1e33;
            text-decoration: none;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        [data-theme="dark"] .top-bar .site-title {
            color: #e2e8f0;
        }

        .top-bar .site-title:hover {
            color: var(--link-color);
        }

        .top-bar .site-title::before {
            content: "🏠";
            font-size: 20px;
        }

        .top-bar .nav-link {
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            text-decoration: none;
            transition: color 0.2s;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        [data-theme="dark"] .top-bar .nav-link {
            color: #cbd5e1;
        }

        .top-bar .nav-link::before {
            content: "｜";
            margin-right: 10px;
            color: #94a3b8;
            font-weight: 300;
        }

        .top-bar .nav-link:hover {
            color: var(--link-color);
            border-bottom-color: var(--link-color);
        }

        .top-bar .nav-link.active {
            color: var(--link-color);
            border-bottom-color: var(--link-color);
        }

        .clock-display {
            font-size: 16px;
            font-weight: 500;
            color: var(--clock-color);
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s;
            cursor: default;
            user-select: none;
            min-width: 80px;
            text-align: right;
        }

        .clock-display:hover {
            color: var(--link-color);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.3s;
            color: #0b1e33;
            background: #f1f4f9;
            border: 1px solid #e2e8f0;
            line-height: 1;
        }

        [data-theme="dark"] .theme-toggle {
            color: #e2e8f0;
            background: #2a3a4a;
            border: 1px solid #3a4a5a;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: scale(1.1);
        }

        /* ===== 主内容 ===== */
        .main {
            flex: 1;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 90px 28px 40px 28px;
        }

        .about-header {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .about-avatar {
            flex-shrink: 0;
            width: 88px;
            height: 88px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid var(--card-border);
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s, background 0.3s;
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        .about-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .about-title h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            transition: color 0.4s;
        }

        .about-title .sub {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 4px;
            transition: color 0.4s;
        }

        .badge-status {
            display: inline-block;
            background: #22c55e;
            color: white;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 16px;
            border-radius: 30px;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.25);
        }

        .about-body {
            font-size: 16px;
            line-height: 1.9;
            color: var(--text-secondary);
            transition: color 0.4s;
            margin-top: 4px;
        }

        .about-body .highlight {
            color: var(--link-color);
            font-weight: 600;
        }

        .about-body p {
            margin-bottom: 20px;
        }

        /* 签名 */
        .signature {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            text-align: right;
            font-size: 15px;
            color: var(--text-muted);
            font-style: italic;
            transition: border-color 0.4s, color 0.4s;
        }

        .signature .name {
            font-style: normal;
            color: var(--link-color);
            font-weight: 600;
        }

        /* 按钮区 */
        .btn-area {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .btn-area a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--link-color);
            color: white;
            box-shadow: 0 4px 14px rgba(var(--theme-color-rgb), 0.25);
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(var(--theme-color-rgb), 0.35);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--card-border);
        }

        .btn-outline:hover {
            border-color: var(--link-color);
            color: var(--link-color);
            background: rgba(var(--theme-color-rgb), 0.04);
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            padding: 24px 0 28px 0;
            border-top: 1px solid var(--footer-border);
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            transition: color 0.4s, border-color 0.4s;
        }

        .footer a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .main {
                padding: 80px 18px 30px 18px;
            }
            .about-header {
                gap: 24px;
            }
            .about-avatar {
                width: 72px;
                height: 72px;
                border-radius: 16px;
            }
            .about-title h1 {
                font-size: 26px;
            }
            .top-bar {
                padding: 10px 18px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .top-bar .site-title {
                font-size: 16px;
            }
            .top-bar .nav-link {
                font-size: 14px;
            }
            .clock-display {
                font-size: 14px;
                min-width: 70px;
            }
            .theme-toggle {
                font-size: 18px;
                padding: 3px 6px;
            }
            .about-body {
                font-size: 15px;
            }
        }

        @media (max-width: 400px) {
            .main {
                padding: 72px 14px 24px 14px;
            }
            .about-avatar {
                width: 60px;
                height: 60px;
                border-radius: 12px;
            }
            .about-title h1 {
                font-size: 22px;
            }
            .about-body {
                font-size: 14px;
            }
            .about-header {
                gap: 16px;
            }
            .top-bar {
                padding: 8px 12px;
            }
            .top-bar .site-title {
                font-size: 14px;
            }
            .top-bar .nav-link {
                font-size: 12px;
            }
            .top-bar .nav-link::before {
                margin-right: 4px;
            }
            .clock-display {
                font-size: 12px;
                min-width: 60px;
            }
            .theme-toggle {
                font-size: 16px;
                padding: 2px 5px;
            }
            .footer {
                font-size: 12px;
                padding: 18px 0 20px 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 导航条 ===== -->
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="site-title">BlueCat114 官方网站</a>
            <a href="project.html" class="nav-link">项目</a>
            <a href="game.html" class="nav-link">网页游戏</a>

        </div>

    <!-- ===== 主要内容 ===== -->
    <div class="main">

        <div class="about-header">
            <div class="about-avatar">
                <img src="favicon.png" alt="BlueCat114" />
            </div>
            <div class="about-title">
                <h1>关于我</h1>

        <!-- ===== 页脚 ===== -->
        <div class="footer">

    </div>

    <!-- ===== 主题色 + 宠物加载器 ===== -->
    <script src="pet-loader.js"></script>

    <script>
        // ===== 人机验证检查 =====
        (function() {
            const verified = localStorage.getItem('verified');
            const verifiedTime = parseInt(localStorage.getItem('verifiedTime') || '0');
            const EXPIRY = 7 * 24 * 60 * 60 * 1000;
            if (window.location.pathname.includes('verify.html')) return;
            if (!verified || Date.now() - verifiedTime > EXPIRY) {
                window.location.href = 'verify.html';
            }
        })();

        // ===== 年份自动更新 =====
        document.getElementById('year').textContent = new Date().getFullYear();

        // ===== 时钟 + 主题控制 =====
        const clockDisplay = document.getElementById('clockDisplay');
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        let isAutoMode = true;
        let currentTheme = 'light';
        let savedThemeMode = 'auto';
        let timeThemeTimer = null;

        function getThemeByHour() {
            const h = new Date().getHours();
            return (h >= 6 && h < 18) ? 'light' : 'dark';
        }

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            toggle.textContent = theme === 'dark' ? '🌙' : '☀️';
            currentTheme = theme;
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('webSettings');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    savedThemeMode = parsed.theme || 'auto';
                } catch {
                    savedThemeMode = 'auto';
                }
            } else {
                savedThemeMode = 'auto';
            }
            return savedThemeMode;
        }

        function applyThemeFromMode(mode) {
            if (mode === 'auto') {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            } else if (mode === 'time') {
                applyTheme(getThemeByHour());
                isAutoMode = false;
                startTimeThemeTimer();
            } else if (mode === 'light' || mode === 'dark') {
                applyTheme(mode);
                isAutoMode = false;
                stopTimeThemeTimer();
            } else {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            }
        }

        function startTimeThemeTimer() {
            stopTimeThemeTimer();
            timeThemeTimer = setInterval(() => {
                const target = getThemeByHour();
                if (target !== currentTheme) {
                    applyTheme(target);
                }
            }, 60000);
        }

        function stopTimeThemeTimer() {
            if (timeThemeTimer) {
                clearInterval(timeThemeTimer);
                timeThemeTimer = null;
            }
        }

        function initTheme() {
            const mode = loadSavedTheme();
            applyThemeFromMode(mode);
        }

        clockDisplay.addEventListener('dblclick', function() {
            savedThemeMode = 'auto';
            localStorage.setItem('webSettings', JSON.stringify({ theme: 'auto' }));
            applyThemeFromMode('auto');
        });

        toggle.addEventListener('click', function() {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            savedThemeMode = next;
            localStorage.setItem('webSettings', JSON.stringify({ theme: next }));
            applyThemeFromMode(next);
        });

        if (window.matchMedia) {
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            media.addEventListener('change', function(e) {
                const mode = loadSavedTheme();
                if (mode === 'auto') {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'webSettings') {
                const mode = loadSavedTheme();
                applyThemeFromMode(mode);
            }
        });

        initTheme();

        function updateClockDisplay() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clockDisplay.textContent = h + ':' + m + ':' + s;
        }
        updateClockDisplay();
        setInterval(updateClockDisplay, 1000);
    </script>

</body>
