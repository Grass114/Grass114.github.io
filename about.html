<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>关于我 · Grass114</title>
    <style>
        :root {
            --bg: #050508;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 40%);
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            pointer-events: none;
        }

        header {
            width: 100%;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .clock-wrapper {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clock-dot {
            width: 6px; height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 50px 60px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 40px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 32px;
        }

        .avatar {
            width: 80px; height: 80px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.5);
            padding: 8px;
            object-fit: contain;
        }

        .profile-info h2 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
        .badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .bio { font-size: 16px; line-height: 1.8; color: #cccccc; margin-bottom: 24px; }
        .bio strong { color: var(--text-main); font-weight: 600; }
        .bio p { margin-bottom: 16px; }

        .actions { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 32px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }

        .btn-primary { background: var(--text-main); color: var(--bg); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,255,255,0.15); }
        .btn-outline { background: transparent; color: var(--text-main); border-color: var(--card-border); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 768px) {
            header { padding: 24px; }
            main { padding: 0 24px 40px; }
            .content-card { padding: 24px; }
            .profile-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .avatar { width: 64px; height: 64px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="grid-overlay"></div>

    <header>
        <a href="index.html" class="logo">Grass114</a>
        <div class="clock-wrapper">
            <div class="clock-dot"></div>
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <main>
        <h1 class="page-title">关于我 / ABOUT</h1>
        <div class="content-card">
            <div class="profile-header">
                <img src="favicon.png" alt="Grass114" class="avatar" />
                <div class="profile-info">
                    <h2>Grass114</h2>
                    <span class="badge">🟢 活跃中</span>
                </div>
            </div>

            <div class="bio">
                <p>👋 你好！我是 <strong>Grass114</strong>。一个喜欢捣鼓各种有意思的东西，并且热爱分享的人。</p>
                <p>🎯 做这个网站，是为了把我的作品和想法集中放在一个地方。这一路上我学到了很多，也希望能帮到同样热爱折腾的你。</p>
            </div>

            <div class="actions">
                <a href="index.html" class="btn btn-primary">← 返回首页</a>
                <a href="https://github.com/grass114" target="_blank" class="btn btn-outline">🐙 GitHub 主页</a>
            </div>
        </div>
    </main>

    <script>
        const clock = document.getElementById('clock');
        setInterval(() => {
            const now = new Date();
            clock.textContent = 
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
