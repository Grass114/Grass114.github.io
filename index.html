<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Grass114</title>
    <style>
        :root {
            --bg: #050508;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-bg: rgba(255, 255, 255, 0.06);
            --card-hover-border: rgba(255, 255, 255, 0.2);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 40%);
        }
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            pointer-events: none;
        }
        header {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            user-select: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .clock-wrapper {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .clock-dot {
            width: 6px; height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }
        main {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 50px;
        }
        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }
        .nav-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: background-color 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .card-text { display: flex; flex-direction: column; gap: 6px; }
        .card-title { font-size: 18px; font-weight: 600; }
        .card-sub { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 0.5px; }
        .nav-arrow {
            font-size: 20px;
            color: var(--text-muted);
            transition: transform 0.2s, color 0.2s;
        }
        .nav-card:hover {
            background: var(--card-hover-bg);
            border-color: var(--card-hover-border);
            transform: translateX(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .nav-card:hover .nav-arrow {
            color: var(--text-main);
            transform: translateX(4px) translateY(-4px);
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes fadeIn { to { opacity: 1; } }
        @media (max-width: 768px) {
            header { padding: 24px; }
            main { padding: 0 24px; }
            .nav-card { padding: 16px 20px; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="grid-overlay"></div>

    <header>
        <div class="logo">Grass114</div>
        <div class="clock-wrapper">
            <div class="clock-dot"></div>
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <main>
        <nav class="nav-grid">
            <!-- 修改：指向 game.html -->
            <a href="game.html" class="nav-card">
                <div class="card-text">
                    <span class="card-title">游戏中心</span>
                    <span class="card-sub">GAMES</span>
                </div>
                <span class="nav-arrow">↗</span>
            </a>
            <a href="thankyou.html" class="nav-card">
                <div class="card-text">
                    <span class="card-title">致谢</span>
                    <span class="card-sub">感谢 / THANKS</span>
                </div>
                <span class="nav-arrow">↗</span>
            </a>
        </nav>
    </main>

    <script>
        const clock = document.getElementById('clock');
        setInterval(() => {
            const now = new Date();
            clock.textContent = 
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
