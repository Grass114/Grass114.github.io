<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>BlueCat114 的官方网站</title>
    <style>
        /* ===== 颜色变量 ===== */
        :root {
            --theme-color: #6c63ff;
            --theme-color-rgb: 108, 99, 255;

            --bg-start: #f5f9ff;
            --bg-end: #e6edf7;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-primary: #0b1e33;
            --text-secondary: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --shadow-color: rgba(0, 20, 40, 0.08);
            --shadow-hover: rgba(0, 20, 40, 0.12);
            --topbar-bg: rgba(255, 255, 255, 0.6);
            --topbar-border: rgba(255, 255, 255, 0.8);
            --footer-border: rgba(255, 255, 255, 0.6);
            --link-color: var(--theme-color, #6c63ff);
            --link-hover: var(--theme-color, #4a42b8);
            --clock-color: var(--text-muted);
            --btn-shadow: rgba(108, 99, 255, 0.25);
            --btn-hover-shadow: rgba(108, 99, 255, 0.35);
        }

        [data-theme="dark"] {
            --bg-start: #0f1724;
            --bg-end: #1a2332;
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-border: rgba(71, 85, 105, 0.5);
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --text-light: #64748b;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.4);
            --topbar-bg: rgba(15, 23, 36, 0.8);
            --topbar-border: rgba(71, 85, 105, 0.5);
            --footer-border: rgba(71, 85, 105, 0.4);
            --link-color: var(--theme-color, #818cf8);
            --link-hover: var(--theme-color, #a5b4fc);
            --clock-color: #94a3b8;
            --btn-shadow: rgba(108, 99, 255, 0.15);
            --btn-hover-shadow: rgba(108, 99, 255, 0.25);
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 70px 24px 24px 24px;
            transition: background 0.4s ease, color 0.4s ease;
            color: var(--text-primary);
        }

        /* ===== 导航条 ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            padding: 12px 28px;
            background: #ffffff;
            border-bottom: 1px solid #e9edf2;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        [data-theme="dark"] .top-bar {
            background: #1a2332;
            border-bottom: 1px solid #2a3a4a;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar .site-title {
            font-size: 18px;
            font-weight: 600;
            color: #0b1e33;
            text-decoration: none;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        [data-theme="dark"] .top-bar .site-title {
            color: #e2e8f0;
        }

        .top-bar .site-title:hover {
            color: var(--link-color);
        }

        .top-bar .site-title::before {
            content: "🏠";
            font-size: 20px;
        }

        .top-bar .nav-link {
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            text-decoration: none;
            transition: color 0.2s;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        [data-theme="dark"] .top-bar .nav-link {
            color: #cbd5e1;
        }

        .top-bar .nav-link::before {
            content: "｜";
            margin-right: 10px;
            color: #94a3b8;
            font-weight: 300;
        }

        .top-bar .nav-link:hover {
            color: var(--link-color);
            border-bottom-color: var(--link-color);
        }

        .top-bar .nav-link.active {
            color: var(--link-color);
            border-bottom-color: var(--link-color);
        }

        /* ===== 时钟显示 ===== */
        .clock-display {
            font-size: 16px;
            font-weight: 500;
            color: var(--clock-color);
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s;
            cursor: default;
            user-select: none;
            min-width: 80px;
            text-align: right;
        }

        .clock-display:hover {
            color: var(--link-color);
        }

        /* ===== 主题切换按钮 ===== */
        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.3s;
            color: #0b1e33;
            background: #f1f4f9;
            border: 1px solid #e2e8f0;
            line-height: 1;
        }

        [data-theme="dark"] .theme-toggle {
            color: #e2e8f0;
            background: #2a3a4a;
            border: 1px solid #3a4a5a;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: scale(1.1);
        }

        #top {
            position: absolute;
            top: 0;
        }

        /* ===== 主容器 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 0 20px 0;
            justify-content: flex-start;
            padding-top: 30px;
        }

        /* ===== 天空场景容器（居中，透明背景） ===== */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 0;
        }

        .sky-scene {
            width: 520px;
            max-width: 100%;
            position: relative;
            background: transparent;
        }

        /* SVG 画布 */
        .sky-svg {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
            overflow: visible;
        }

        /* 弧线 */
        .sky-svg .arc-path {
            fill: none;
            stroke: rgba(var(--theme-color-rgb, 108, 99, 255), 0.3);
            stroke-width: 2;
            stroke-dasharray: 6 6;
            transition: stroke 0.4s ease;
        }

        /* 天体组的过渡 */
        #sunGroup,
        #moonGroup {
            transition: opacity 0.8s ease;
        }

        /* 天体上方的进度文字 */
        .celestial-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 700;
            fill: var(--text-primary, #0b1e33);
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            user-select: none;
            transition: fill 0.4s ease;
        }

        [data-theme="dark"] .celestial-text {
            fill: #e2e8f0;
        }

        /* 时间信息（圆弧下方） */
        .sky-info {
            position: relative;
            padding: 0 0 8px 0;
            margin-top: -20px;
            text-align: center;
        }

        .sky-info .time {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            letter-spacing: 1px;
            transition: color 0.4s;
        }

        .sky-info .date-line {
            font-size: 15px;
            color: var(--text-muted);
            margin-top: 6px;
            transition: color 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sky-info .date-line .dot {
            color: var(--text-light);
        }

        /* ===== 按钮区（居中） ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 36px;
            width: 100%;
        }

        .actions a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 36px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            box-shadow: 0 4px 14px var(--btn-shadow);
        }

        .actions a:hover {
            background: #5a52d5;
            transform: scale(1.04);
            box-shadow: 0 8px 28px var(--btn-hover-shadow);
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            padding-top: 22px;
            border-top: 1px solid var(--footer-border);
            width: 100%;
            margin-top: 8px;
            letter-spacing: 0.3px;
            transition: color 0.4s, border-color 0.4s;
        }

        .footer a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            body {
                padding: 66px 16px 16px 16px;
            }
            .main {
                padding-top: 20px;
            }
            .sky-scene {
                width: 400px;
            }
            .sky-info .time {
                font-size: 34px;
            }
            .sky-info .date-line {
                font-size: 13px;
            }
            .actions {
                margin-top: 28px;
            }
            .actions a {
                padding: 12px 28px;
                font-size: 14px;
            }
            .top-bar {
                padding: 10px 18px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .top-bar .site-title {
                font-size: 16px;
            }
            .top-bar .nav-link {
                font-size: 14px;
            }
            .clock-display {
                font-size: 14px;
                min-width: 70px;
            }
            .theme-toggle {
                font-size: 18px;
                padding: 3px 6px;
            }
        }

        @media (max-width: 450px) {
            .main {
                padding-top: 16px;
            }
            .sky-scene {
                width: 300px;
            }
            .sky-info .time {
                font-size: 28px;
            }
            .sky-info .date-line {
                font-size: 12px;
                gap: 5px;
            }
            .actions {
                margin-top: 24px;
            }
            .actions a {
                padding: 10px 20px;
                font-size: 13px;
            }
            .top-bar {
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 4px;
            }
            .top-bar .site-title {
                font-size: 14px;
            }
            .top-bar .nav-link {
                font-size: 12px;
            }
            .top-bar .nav-link::before {
                margin-right: 4px;
            }
            .clock-display {
                font-size: 12px;
                min-width: 60px;
            }
            .theme-toggle {
                font-size: 16px;
                padding: 2px 5px;
            }
        }
    </style>
</head>
<body>

    <div id="top"></div>

    <!-- ===== 导航条 ===== -->
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="site-title">BlueCat114 官方网站</a>
            <a href="project.html" class="nav-link">项目</a>
            <a href="game.html" class="nav-link">网页游戏</a>
            <a href="thankyou.html" class="nav-link">致谢</a>
            <a href="about.html" class="nav-link">关于我</a>
            <a href="settings.html" class="nav-link">设置</a>
        </div>
        <div class="top-bar-right">
            <div class="clock-display" id="clockDisplay" title="双击恢复自动模式">--:--:--</div>
            <button class="theme-toggle" id="themeToggle" aria-label="切换暗色/亮色模式">☀️</button>
        </div>
    </div>

    <div class="main">

        <!-- ===== 天空场景（居中，透明背景） ===== -->
        <div class="hero">
            <div class="sky-scene" id="skyScene">

                <!-- SVG：弧线 + 太阳 + 月亮 + 进度文字 -->
                <svg class="sky-svg" viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="sunGrad" cx="38%" cy="35%" r="65%">
                            <stop offset="0%" stop-color="#fff9d6"/>
                            <stop offset="45%" stop-color="#ffd93d"/>
                            <stop offset="100%" stop-color="#ff9500"/>
                        </radialGradient>
                        <radialGradient id="moonGrad" cx="38%" cy="35%" r="65%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="55%" stop-color="#dbe4ff"/>
                            <stop offset="100%" stop-color="#a5b4fc"/>
                        </radialGradient>
                        <filter id="sunBlur" x="-60%" y="-60%" width="220%" height="220%">
                            <feGaussianBlur stdDeviation="8"/>
                        </filter>
                        <filter id="moonBlur" x="-60%" y="-60%" width="220%" height="220%">
                            <feGaussianBlur stdDeviation="7"/>
                        </filter>
                    </defs>

                    <!-- 弧线轨迹（半圆，整体上移） -->
                    <path class="arc-path" d="M 60 260 A 200 200 0 0 1 460 260"/>

                    <!-- 太阳 -->
                    <g id="sunGroup">
                        <circle id="sunGlow" cx="260" cy="60" r="42" fill="#ffd93d" opacity="0.4" filter="url(#sunBlur)"/>
                        <circle id="sunCircle" cx="260" cy="60" r="28" fill="url(#sunGrad)"/>
                        <text id="sunText" class="celestial-text" x="260" y="18" font-size="15">0.0%</text>
                    </g>

                    <!-- 月亮 -->
                    <g id="moonGroup" opacity="0">
                        <circle id="moonGlow" cx="260" cy="60" r="42" fill="#a5b4fc" opacity="0.35" filter="url(#moonBlur)"/>
                        <circle id="moonCircle" cx="260" cy="60" r="28" fill="url(#moonGrad)"/>
                        <text id="moonText" class="celestial-text" x="260" y="18" font-size="15">0.0%</text>
                    </g>
                </svg>

                <!-- 时间日期星期（圆弧下方） -->
                <div class="sky-info">
                    <div class="time" id="timeDisplay">--:--:--</div>
                    <div class="date-line">
                        <span id="dateDisplay">----年--月--日</span>
                        <span class="dot">·</span>
                        <span id="weekdayDisplay">星期-</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- ===== 按钮区（居中） ===== -->
        <div class="actions">
            <a href="https://github.com/grass114" target="_blank">🐙 GitHub</a>
        </div>

        <!-- ===== 页脚 ===== -->
        <div class="footer">
            © <span id="year"></span> <a href="https://github.com/grass114">BlueCat114</a> · 用 ❤️ 和 ☕ 打造
        </div>

    </div>

    <!-- ===== 主题色 + 宠物加载器 ===== -->
    <script src="pet-loader.js"></script>

    <script>
        // ===== 人机验证检查 =====
        (function() {
            const verified = localStorage.getItem('verified');
            const verifiedTime = parseInt(localStorage.getItem('verifiedTime') || '0');
            const EXPIRY = 7 * 24 * 60 * 60 * 1000;
            if (window.location.pathname.includes('verify.html')) return;
            if (!verified || Date.now() - verifiedTime > EXPIRY) {
                window.location.href = 'verify.html';
            }
        })();

        // ===== 年份自动更新 =====
        document.getElementById('year').textContent = new Date().getFullYear();

        // ============================================================
        //  天空场景 - 太阳/月亮沿弧线移动 + 进度百分比
        // ============================================================

        const sunGroup = document.getElementById('sunGroup');
        const moonGroup = document.getElementById('moonGroup');
        const sunCircle = document.getElementById('sunCircle');
        const sunGlow = document.getElementById('sunGlow');
        const sunText = document.getElementById('sunText');
        const moonCircle = document.getElementById('moonCircle');
        const moonGlow = document.getElementById('moonGlow');
        const moonText = document.getElementById('moonText');
        const timeDisplay = document.getElementById('timeDisplay');
        const dateDisplay = document.getElementById('dateDisplay');
        const weekdayDisplay = document.getElementById('weekdayDisplay');

        const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

        // ===== SVG 坐标系（与 viewBox 一致）=====
        const ARC_CX = 260;
        const ARC_CY = 260;   // 弧线底边（整体上移）
        const ARC_R = 200;    // 半径（配合上移）
        const BODY_R = 28;

        // 根据视口宽度调整进度文字字号
        function getTextSize() {
            const w = window.innerWidth;
            if (w <= 450) return 11;
            if (w <= 700) return 13;
            return 15;
        }

        function updateCelestial() {
            const now = new Date();

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');

            // 更新时间文字
            timeDisplay.textContent = `${hh}:${mm}:${ss}`;
            dateDisplay.textContent = `${year}年${month}月${day}日`;
            weekdayDisplay.textContent = WEEKDAYS[now.getDay()];

            // 当前时间（小时为小数）
            const hours = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;

            const isDay = hours >= 6 && hours < 18;

            // 计算进度 0~1
            let progress;
            if (isDay) {
                progress = (hours - 6) / 12;
            } else {
                let t = hours - 18;
                if (t < 0) t += 24;
                progress = t / 12;
            }

            // 百分比（一位小数，每秒都在变化）
            const percent = Math.min(100, progress * 100);
            const percentText = percent.toFixed(1) + '%';

            // 角度：左侧 π → 右侧 0
            const angle = Math.PI * (1 - progress);

            // 天体中心坐标（精确在弧线上）
            const x = ARC_CX + ARC_R * Math.cos(angle);
            const y = ARC_CY - ARC_R * Math.sin(angle);

            // 更新太阳坐标
            sunCircle.setAttribute('cx', x);
            sunCircle.setAttribute('cy', y);
            sunGlow.setAttribute('cx', x);
            sunGlow.setAttribute('cy', y);

            // 更新月亮坐标
            moonCircle.setAttribute('cx', x);
            moonCircle.setAttribute('cy', y);
            moonGlow.setAttribute('cx', x);
            moonGlow.setAttribute('cy', y);

            // 进度文字放在图标上方
            const textY = y - BODY_R - 12;
            const textSize = getTextSize();

            sunText.setAttribute('x', x);
            sunText.setAttribute('y', textY);
            sunText.setAttribute('font-size', textSize);
            sunText.textContent = percentText;

            moonText.setAttribute('x', x);
            moonText.setAttribute('y', textY);
            moonText.setAttribute('font-size', textSize);
            moonText.textContent = percentText;

            // 显示/隐藏切换
            sunGroup.style.opacity = isDay ? '1' : '0';
            moonGroup.style.opacity = isDay ? '0' : '1';
        }

        // 启动
        updateCelestial();
        setInterval(updateCelestial, 1000);

        // ============================================================
        //  统一的主题控制
        // ============================================================
        const clockDisplay = document.getElementById('clockDisplay');
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        let isAutoMode = true;
        let currentTheme = 'light';
        let savedThemeMode = 'auto';
        let timeThemeTimer = null;

        function getThemeByHour() {
            const h = new Date().getHours();
            return (h >= 6 && h < 18) ? 'light' : 'dark';
        }

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            toggle.textContent = theme === 'dark' ? '🌙' : '☀️';
            currentTheme = theme;
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('webSettings');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    savedThemeMode = parsed.theme || 'auto';
                } catch {
                    savedThemeMode = 'auto';
                }
            } else {
                savedThemeMode = 'auto';
            }
            return savedThemeMode;
        }

        function applyThemeFromMode(mode) {
            if (mode === 'auto') {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            } else if (mode === 'time') {
                applyTheme(getThemeByHour());
                isAutoMode = false;
                startTimeThemeTimer();
            } else if (mode === 'light' || mode === 'dark') {
                applyTheme(mode);
                isAutoMode = false;
                stopTimeThemeTimer();
            } else {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            }
        }

        function startTimeThemeTimer() {
            stopTimeThemeTimer();
            timeThemeTimer = setInterval(() => {
                const target = getThemeByHour();
                if (target !== currentTheme) {
                    applyTheme(target);
                }
            }, 60000);
        }

        function stopTimeThemeTimer() {
            if (timeThemeTimer) {
                clearInterval(timeThemeTimer);
                timeThemeTimer = null;
            }
        }

        function initTheme() {
            const mode = loadSavedTheme();
            applyThemeFromMode(mode);
        }

        clockDisplay.addEventListener('dblclick', function() {
            savedThemeMode = 'auto';
            localStorage.setItem('webSettings', JSON.stringify({ theme: 'auto' }));
            applyThemeFromMode('auto');
        });

        toggle.addEventListener('click', function() {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            savedThemeMode = next;
            localStorage.setItem('webSettings', JSON.stringify({ theme: next }));
            applyThemeFromMode(next);
        });

        if (window.matchMedia) {
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            media.addEventListener('change', function(e) {
                const mode = loadSavedTheme();
                if (mode === 'auto') {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'webSettings') {
                const mode = loadSavedTheme();
                applyThemeFromMode(mode);
            }
        });

        initTheme();

        function updateClockDisplay() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clockDisplay.textContent = h + ':' + m + ':' + s;
        }
        updateClockDisplay();
        setInterval(updateClockDisplay, 1000);
    </script>

</body>
</html>
