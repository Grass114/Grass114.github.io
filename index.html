<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>BlueCat114 的官方网站</title>
    <style>
        /* ===== 颜色变量 ===== */
        :root {
            --bg-start: #f5f9ff;
            --bg-end: #e6edf7;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-primary: #0b1e33;
            --text-secondary: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --shadow-color: rgba(0, 20, 40, 0.08);
            --shadow-hover: rgba(0, 20, 40, 0.12);
            --topbar-bg: rgba(255, 255, 255, 0.6);
            --topbar-border: rgba(255, 255, 255, 0.8);
            --footer-border: rgba(255, 255, 255, 0.6);
            --link-color: #6c63ff;
            --link-hover: #4a42b8;
            --clock-color: var(--text-muted);
            --btn-shadow: rgba(108, 99, 255, 0.25);
            --btn-hover-shadow: rgba(108, 99, 255, 0.35);
            --intro-bg: rgba(255, 255, 255, 0.65);
            --intro-border: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-start: #0f1724;
            --bg-end: #1a2332;
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-border: rgba(71, 85, 105, 0.5);
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --text-light: #64748b;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.4);
            --topbar-bg: rgba(15, 23, 36, 0.8);
            --topbar-border: rgba(71, 85, 105, 0.5);
            --footer-border: rgba(71, 85, 105, 0.4);
            --link-color: #818cf8;
            --link-hover: #a5b4fc;
            --clock-color: #94a3b8;
            --btn-shadow: rgba(108, 99, 255, 0.15);
            --btn-hover-shadow: rgba(108, 99, 255, 0.25);
            --intro-bg: rgba(30, 41, 59, 0.7);
            --intro-border: rgba(71, 85, 105, 0.4);
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 70px 24px 24px 24px;
            transition: background 0.4s ease, color 0.4s ease;
            color: var(--text-primary);
        }

        /* ===== 导航条 ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 28px;
            background: #ffffff;
            border-bottom: 1px solid #e9edf2;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        [data-theme="dark"] .top-bar {
            background: #1a2332;
            border-bottom: 1px solid #2a3a4a;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar .site-title {
            font-size: 18px;
            font-weight: 600;
            color: #0b1e33;
            text-decoration: none;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        [data-theme="dark"] .top-bar .site-title {
            color: #e2e8f0;
        }

        .top-bar .site-title:hover {
            color: var(--link-color);
        }

        .top-bar .site-title::before {
            content: "🏠";
            font-size: 20px;
        }

        .top-bar .nav-link {
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            text-decoration: none;
            transition: color 0.2s;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        [data-theme="dark"] .top-bar .nav-link {
            color: #cbd5e1;
        }

        .top-bar .nav-link::before {
            content: "｜";
            margin-right: 10px;
            color: #94a3b8;
            font-weight: 300;
        }

        .top-bar .nav-link:hover {
            color: var(--link-color);
            border-bottom-color: var(--link-color);
        }

        .top-bar .nav-link.active {
            color: var(--link-color);
            border-bottom-color: var(--link-color);
        }

        /* ===== 时钟显示 ===== */
        .clock-display {
            font-size: 16px;
            font-weight: 500;
            color: var(--clock-color);
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s;
            cursor: default;
            user-select: none;
            min-width: 80px;
            text-align: right;
        }

        .clock-display:hover {
            color: var(--link-color);
        }

        /* ===== 主题切换按钮 ===== */
        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.3s;
            color: #0b1e33;
            background: #f1f4f9;
            border: 1px solid #e2e8f0;
            line-height: 1;
        }

        [data-theme="dark"] .theme-toggle {
            color: #e2e8f0;
            background: #2a3a4a;
            border: 1px solid #3a4a5a;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: scale(1.1);
        }

        #top {
            position: absolute;
            top: 0;
        }

        /* ===== 主容器 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* ===== 标题行（左文右时间） ===== */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
        }

        .hero-left .line {
            display: block;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.05;
            transition: color 0.4s;
        }

        .hero-left .line:first-child {
            font-size: 72px;
        }

        .hero-left .line:last-child {
            font-size: 96px;
        }

        .hero-left .line .highlight {
            color: var(--link-color);
        }

        .hero-right {
            flex-shrink: 0;
            margin-left: 32px;
            text-align: right;
            line-height: 1.3;
        }

        .hero-right .date {
            font-size: 28px;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.4s;
        }

        .hero-right .time {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            transition: color 0.4s;
            font-variant-numeric: tabular-nums;
        }

        [data-theme="dark"] .hero-right .time {
            color: #e2e8f0;
        }

        /* ===== 正文内容（居中） ===== */
        .intro {
            background: var(--intro-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 20px 28px;
            border: 1px solid var(--intro-border);
            box-shadow: 0 4px 20px var(--shadow-color);
            max-width: 560px;
            width: 100%;
            margin-top: 24px;
            margin-left: auto;
            margin-right: auto;
            transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
            text-align: left;
        }

        .intro p {
            font-size: 17px;
            line-height: 1.9;
            color: var(--text-secondary);
            transition: color 0.4s;
        }

        .intro .highlight {
            color: var(--link-color);
            font-weight: 600;
        }

        /* ===== 按钮区（居中） ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
            width: 100%;
        }

        .actions a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 36px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            box-shadow: 0 4px 14px var(--btn-shadow);
        }

        .actions a:hover {
            background: #5a52d5;
            transform: scale(1.04);
            box-shadow: 0 8px 28px var(--btn-hover-shadow);
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            padding-top: 22px;
            border-top: 1px solid var(--footer-border);
            width: 100%;
            margin-top: 8px;
            letter-spacing: 0.3px;
            transition: color 0.4s, border-color 0.4s;
        }

        .footer a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            body {
                padding: 66px 16px 16px 16px;
            }
            .hero-left .line:first-child {
                font-size: 48px;
            }
            .hero-left .line:last-child {
                font-size: 64px;
            }
            .hero-right .date {
                font-size: 20px;
            }
            .hero-right .time {
                font-size: 34px;
            }
            .intro {
                padding: 16px 18px;
                max-width: 100%;
            }
            .intro p {
                font-size: 15px;
            }
            .actions a {
                padding: 12px 28px;
                font-size: 14px;
            }
            .top-bar {
                padding: 10px 18px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .top-bar .site-title {
                font-size: 16px;
            }
            .top-bar .nav-link {
                font-size: 14px;
            }
            .clock-display {
                font-size: 14px;
                min-width: 70px;
            }
            .theme-toggle {
                font-size: 18px;
                padding: 3px 6px;
            }
        }

        @media (max-width: 400px) {
            .hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .hero-right {
                margin-left: 0;
                text-align: left;
                width: 100%;
            }
            .hero-right .date {
                font-size: 16px;
            }
            .hero-right .time {
                font-size: 26px;
            }
            .hero-left .line:first-child {
                font-size: 38px;
            }
            .hero-left .line:last-child {
                font-size: 48px;
            }
            .intro {
                padding: 14px 14px;
            }
            .intro p {
                font-size: 14px;
            }
            .actions a {
                padding: 10px 20px;
                font-size: 13px;
            }
            .top-bar {
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 4px;
            }
            .top-bar .site-title {
                font-size: 14px;
            }
            .top-bar .nav-link {
                font-size: 12px;
            }
            .top-bar .nav-link::before {
                margin-right: 4px;
            }
            .clock-display {
                font-size: 12px;
                min-width: 60px;
            }
            .theme-toggle {
                font-size: 16px;
                padding: 2px 5px;
            }
        }
    </style>
</head>
<body>

    <div id="top"></div>

    <!-- ===== 导航条 ===== -->
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="site-title">BlueCat114 官方网站</a>
            <a href="project.html" class="nav-link">项目</a>
            <a href="game.html" class="nav-link">网页游戏</a>
            <a href="thankyou.html" class="nav-link">致谢</a>
            <a href="about.html" class="nav-link">关于我</a>
            <a href="settings.html" class="nav-link">设置</a>
        </div>
        <div class="top-bar-right">
            <div class="clock-display" id="clockDisplay" title="双击恢复自动模式">--:--:--</div>
            <button class="theme-toggle" id="themeToggle" aria-label="切换暗色/亮色模式">☀️</button>
        </div>
    </div>

    <div class="main">

        <!-- ===== 标题行：左文右时间 ===== -->
        <div class="hero">
            <div class="hero-left">
                <span class="line">欢迎</span>
                <span class="line">回来！</span>
            </div>
            <div class="hero-right">
                <div class="date" id="dateDisplay">----年--月--日</div>
                <div class="time" id="timeDisplay">--:--:--</div>
            </div>
        </div>

        <!-- ===== 正文内容（居中） ===== -->
        <div class="intro">
            <p>
                我是 <span class="highlight">BlueCat114</span>，一名热爱 Minecraft 生态的
                <span class="highlight">模组工具开发者</span>。<br />
                专注于 <span class="highlight">MCSkin3D 多语言增强</span>、
                皮肤搜索工具、以及各种提升游戏体验的小工具。<br />
                喜欢折腾代码，也乐于分享。
            </p>
        </div>

        <!-- ===== 按钮区（居中） ===== -->
        <div class="actions">
            <a href="https://github.com/grass114" target="_blank">🐙 GitHub</a>
        </div>

        <!-- ===== 页脚 ===== -->
        <div class="footer">
            © <span id="year"></span> <a href="https://github.com/grass114">BlueCat114</a> · 用 ❤️ 和 ☕ 打造
        </div>

    </div>

    <!-- ===== 小宠物（由设置页控制显示） ===== -->
    <script src="pet-loader.js"></script>

    <script>
        // ===== 年份自动更新 =====
        document.getElementById('year').textContent = new Date().getFullYear();

        // ===== 日期时间更新 =====
        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('dateDisplay').textContent = year + '年' + month + '月' + day + '日';
            document.getElementById('timeDisplay').textContent = hours + ':' + minutes + ':' + seconds;
        }

        // 立即更新一次，然后每秒更新
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ============================================================
        //  统一的主题控制（读取 localStorage + 时间自动模式）
        // ============================================================
        const clockDisplay = document.getElementById('clockDisplay');
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        let isAutoMode = true;
        let currentTheme = 'light';
        let savedThemeMode = 'auto';
        let timeThemeTimer = null;

        function getThemeByHour() {
            const h = new Date().getHours();
            return (h >= 6 && h < 18) ? 'light' : 'dark';
        }

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            toggle.textContent = theme === 'dark' ? '🌙' : '☀️';
            currentTheme = theme;
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('webSettings');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    savedThemeMode = parsed.theme || 'auto';
                } catch {
                    savedThemeMode = 'auto';
                }
            } else {
                savedThemeMode = 'auto';
            }
            return savedThemeMode;
        }

        function applyThemeFromMode(mode) {
            if (mode === 'auto') {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            } else if (mode === 'time') {
                applyTheme(getThemeByHour());
                isAutoMode = false;
                startTimeThemeTimer();
            } else if (mode === 'light' || mode === 'dark') {
                applyTheme(mode);
                isAutoMode = false;
                stopTimeThemeTimer();
            } else {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            }
        }

        function startTimeThemeTimer() {
            stopTimeThemeTimer();
            timeThemeTimer = setInterval(() => {
                const target = getThemeByHour();
                if (target !== currentTheme) {
                    applyTheme(target);
                }
            }, 60000);
        }

        function stopTimeThemeTimer() {
            if (timeThemeTimer) {
                clearInterval(timeThemeTimer);
                timeThemeTimer = null;
            }
        }

        function initTheme() {
            const mode = loadSavedTheme();
            applyThemeFromMode(mode);
        }

        // 双击时钟恢复自动模式
        clockDisplay.addEventListener('dblclick', function() {
            savedThemeMode = 'auto';
            localStorage.setItem('webSettings', JSON.stringify({ theme: 'auto' }));
            applyThemeFromMode('auto');
        });

        // 手动切换主题
        toggle.addEventListener('click', function() {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            savedThemeMode = next;
            localStorage.setItem('webSettings', JSON.stringify({ theme: next }));
            applyThemeFromMode(next);
        });

        // 监听系统主题变化
        if (window.matchMedia) {
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            media.addEventListener('change', function(e) {
                const mode = loadSavedTheme();
                if (mode === 'auto') {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        }

        // 监听 localStorage 变化（跨标签页同步）
        window.addEventListener('storage', function(e) {
            if (e.key === 'webSettings') {
                const mode = loadSavedTheme();
                applyThemeFromMode(mode);
            }
        });

        // 初始化
        initTheme();

        function updateClockDisplay() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clockDisplay.textContent = h + ':' + m + ':' + s;
        }
        updateClockDisplay();
        setInterval(updateClockDisplay, 1000);
    </script>

</body>
</html>
