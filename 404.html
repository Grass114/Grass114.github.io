<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>404 · BlueCat114</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #e6edf7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            transition: background 0.4s ease;
        }

        [data-theme="dark"] body {
            background: linear-gradient(145deg, #0f1724 0%, #1a2332 100%);
        }

        .error-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .error-icon {
            font-size: 120px;
            display: block;
            margin-bottom: 8px;
            color: #e74c3c;
        }

        .error-number {
            font-size: 96px;
            font-weight: 800;
            color: #0b1e33;
            letter-spacing: 4px;
            line-height: 1;
            transition: color 0.4s;
        }

        [data-theme="dark"] .error-number {
            color: #e2e8f0;
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            color: #1e293b;
            margin-top: 8px;
            transition: color 0.4s;
        }

        [data-theme="dark"] .error-title {
            color: #cbd5e1;
        }

        .error-desc {
            font-size: 17px;
            color: #64748b;
            margin-top: 8px;
            line-height: 1.7;
            transition: color 0.4s;
        }

        [data-theme="dark"] .error-desc {
            color: #94a3b8;
        }

        .error-btn {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 44px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.25);
            border: none;
            cursor: pointer;
        }

        .error-btn:hover {
            background: #5a52d5;
            transform: scale(1.04);
            box-shadow: 0 8px 28px rgba(108, 99, 255, 0.35);
        }

        .footer-credit {
            margin-top: 48px;
            font-size: 14px;
            color: #94a3b8;
            transition: color 0.4s;
            text-align: center;
        }

        [data-theme="dark"] .footer-credit {
            color: #64748b;
        }

        .footer-credit a {
            color: #6c63ff;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-credit a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .error-icon { font-size: 80px; }
            .error-number { font-size: 64px; }
            .error-title { font-size: 22px; }
            .error-desc { font-size: 15px; }
            .error-btn { padding: 12px 32px; font-size: 15px; }
            .footer-credit { margin-top: 36px; font-size: 13px; }
        }

        @media (max-width: 400px) {
            .error-icon { font-size: 60px; }
            .error-number { font-size: 48px; }
            .error-title { font-size: 18px; }
            .error-desc { font-size: 14px; }
            .error-btn { padding: 10px 24px; font-size: 14px; }
            .footer-credit { margin-top: 28px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <span class="error-icon">❌</span>
        <div class="error-number">404</div>
        <div class="error-title">页面走丢了</div>
        <div class="error-desc">
            可能是链接有误，或者页面已经被移走了。<br />
            回到首页看看有什么新东西吧。
        </div>
        <a href="index.html" class="error-btn">🏠 返回首页</a>

        <div class="footer-credit">
            © <span id="year"></span> <a href="https://github.com/grass114">BlueCat114</a>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        function checkTheme() {
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }
        checkTheme();

        if (window.matchMedia) {
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            media.addEventListener('change', function(e) {
                document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            });
        }
    </script>

</body>
</html>
