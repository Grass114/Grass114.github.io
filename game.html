<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>游戏中心 · BlueCat114</title>
    <style>
        :root {
            --theme-color: #6c63ff;
            --theme-color-rgb: 108, 99, 255;

            --bg-start: #f5f9ff;
            --bg-end: #e6edf7;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-primary: #0b1e33;
            --text-secondary: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --shadow-color: rgba(0, 20, 40, 0.08);
            --shadow-hover: rgba(0, 20, 40, 0.12);
            --topbar-bg: rgba(255, 255, 255, 0.6);
            --topbar-border: rgba(255, 255, 255, 0.8);
            --footer-border: rgba(255, 255, 255, 0.6);
            --link-color: var(--theme-color, #6c63ff);
            --link-hover: var(--theme-color, #4a42b8);
            --clock-color: var(--text-muted);
            --tab-bg: rgba(255, 255, 255, 0.5);
            --tab-active: var(--theme-color, #6c63ff);
            --tab-text: var(--text-secondary);
            --tab-hover: rgba(108, 99, 255, 0.1);
            --game-card-bg: rgba(255, 255, 255, 0.6);
            --game-card-border: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-start: #0f1724;
            --bg-end: #1a2332;
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-border: rgba(71, 85, 105, 0.5);
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --text-light: #64748b;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.4);
            --topbar-bg: rgba(15, 23, 36, 0.8);
            --topbar-border: rgba(71, 85, 105, 0.5);
            --footer-border: rgba(71, 85, 105, 0.4);
            --link-color: var(--theme-color, #818cf8);
            --link-hover: var(--theme-color, #a5b4fc);
            --clock-color: #94a3b8;
            --tab-bg: rgba(30, 41, 59, 0.6);
            --tab-active: var(--theme-color, #818cf8);
            --tab-text: #cbd5e1;
            --tab-hover: rgba(129, 140, 248, 0.15);
            --game-card-bg: rgba(30, 41, 59, 0.6);
            --game-card-border: rgba(71, 85, 105, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 70px 24px 24px 24px;
            transition: background 0.4s ease, color 0.4s ease;
            color: var(--text-primary);
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            padding: 12px 28px;
            background: #ffffff;
            border-bottom: 1px solid #e9edf2;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        [data-theme="dark"] .top-bar {
            background: #1a2332;
            border-bottom: 1px solid #2a3a4a;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar .site-title {
            font-size: 18px;
            font-weight: 600;
            color: #0b1e33;
            text-decoration: none;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        [data-theme="dark"] .top-bar .site-title {
            color: #e2e8f0;
        }

        .top-bar .site-title:hover {
            color: var(--link-color);
        }

        .top-bar .site-title::before {
            content: "🏠";
            font-size: 20px;
        }

        .top-bar .nav-link {
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            text-decoration: none;
            transition: color 0.2s;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        [data-theme="dark"] .top-bar .nav-link {
            color: #cbd5e1;
        }

        .top-bar .nav-link::before {
            content: "｜";
            margin-right: 10px;
            color: #94a3b8;
            font-weight: 300;
        }

        .top-bar .nav-link:hover {
            color: var(--link-color);
            border-bottom-color: var(--link-color);
        }

        .top-bar .nav-link.active {
            color: var(--link-color);
            border-bottom-color: var(--link-color);
        }

        .clock-display {
            font-size: 16px;
            font-weight: 500;
            color: var(--clock-color);
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s;
            cursor: default;
            user-select: none;
            min-width: 80px;
            text-align: right;
        }

        .clock-display:hover {
            color: var(--link-color);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.3s;
            color: #0b1e33;
            background: #f1f4f9;
            border: 1px solid #e2e8f0;
            line-height: 1;
        }

        [data-theme="dark"] .theme-toggle {
            color: #e2e8f0;
            background: #2a3a4a;
            border: 1px solid #3a4a5a;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: scale(1.1);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 0;
            position: relative;
        }

        .page-title {
            text-align: center;
            margin: 30px 0 24px 0;
            width: 100%;
        }

        .page-title h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            transition: color 0.4s;
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 16px;
            margin-top: 4px;
            transition: color 0.4s;
        }

        .tab-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 24px;
        }

        .tab-btn {
            padding: 12px 8px;
            border: 2px solid var(--card-border);
            border-radius: 16px;
            background: var(--tab-bg);
            color: var(--tab-text);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            font-family: inherit;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px var(--shadow-color);
            text-decoration: none;
            display: block;
        }

        .tab-btn:hover {
            background: var(--tab-hover);
            transform: translateY(-2px);
            border-color: var(--link-color);
        }

        .tab-btn.active {
            background: var(--tab-active);
            color: white;
            border-color: var(--tab-active);
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.25);
        }

        .tab-btn .tab-icon {
            display: block;
            font-size: 28px;
            margin-bottom: 4px;
        }
        .tab-btn .tab-label {
            font-size: 13px;
        }

        .placeholder-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            text-align: center;
            background: var(--game-card-bg);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            border: 2px dashed var(--card-border);
            min-height: 400px;
            transition: background 0.4s, border-color 0.4s;
        }

        .placeholder-game .big-icon {
            font-size: 72px;
            margin-bottom: 16px;
            opacity: 0.6;
        }
        .placeholder-game h2 {
            font-size: 28px;
            color: var(--text-primary);
            margin-bottom: 8px;
            transition: color 0.4s;
        }
        .placeholder-game p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 400px;
            transition: color 0.4s;
        }

        .footer {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            padding-top: 22px;
            border-top: 1px solid var(--footer-border);
            width: 100%;
            margin-top: 24px;
            letter-spacing: 0.3px;
            transition: color 0.4s, border-color 0.4s;
        }

        .footer a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        @media (max-width: 820px) {
            .tab-bar {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }
            .tab-btn {
                padding: 10px 4px;
                font-size: 13px;
                border-radius: 12px;
            }
            .tab-btn .tab-icon {
                font-size: 22px;
            }
            .tab-btn .tab-label {
                font-size: 11px;
            }
            .top-bar {
                padding: 10px 18px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .top-bar .site-title {
                font-size: 16px;
            }
            .top-bar .nav-link {
                font-size: 14px;
            }
            .clock-display {
                font-size: 14px;
                min-width: 70px;
            }
            .theme-toggle {
                font-size: 18px;
                padding: 3px 6px;
            }
            .page-title h1 {
                font-size: 26px;
            }
            .placeholder-game .big-icon {
                font-size: 48px;
            }
            .placeholder-game h2 {
                font-size: 22px;
            }
            .placeholder-game {
                padding: 40px 20px;
                min-height: 280px;
            }
        }

        @media (max-width: 480px) {
            .tab-bar {
                grid-template-columns: repeat(5, 1fr);
                gap: 4px;
            }
            .tab-btn {
                padding: 8px 2px;
                font-size: 11px;
                border-radius: 10px;
                border-width: 1.5px;
            }
            .tab-btn .tab-icon {
                font-size: 18px;
            }
            .tab-btn .tab-label {
                font-size: 9px;
            }
            .top-bar {
                padding: 8px 12px;
            }
            .top-bar .site-title {
                font-size: 14px;
            }
            .top-bar .nav-link {
                font-size: 12px;
            }
            .top-bar .nav-link::before {
                margin-right: 4px;
            }
            .clock-display {
                font-size: 12px;
                min-width: 60px;
            }
            .theme-toggle {
                font-size: 16px;
                padding: 2px 5px;
            }
            .page-title h1 {
                font-size: 22px;
            }
            .placeholder-game .big-icon {
                font-size: 36px;
            }
            .placeholder-game h2 {
                font-size: 18px;
            }
            .placeholder-game {
                padding: 30px 16px;
                min-height: 200px;
            }
            .placeholder-game p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="site-title">BlueCat114 官方网站</a>
            <a href="project.html" class="nav-link">项目</a>
            <a href="game.html" class="nav-link active">网页游戏</a>
            <a href="thankyou.html" class="nav-link">致谢</a>

    </div>

    <div class="main">

        <div class="page-title">
            <h1>🎮 游戏中心</h1>

        </div>

        <div class="tab-bar">

                <span class="tab-icon">🧱</span>
                <span class="tab-label">打砖块</span>

            <div class="tab-btn" style="cursor:default; opacity:0.6;">

        <div class="footer">

        </div>

    </div>

    <script src="pet-loader.js"></script>

    <script>
        // ===== 人机验证检查 =====
        (function() {
            const verified = localStorage.getItem('verified');
            const verifiedTime = parseInt(localStorage.getItem('verifiedTime') || '0');
            const EXPIRY = 7 * 24 * 60 * 60 * 1000;
            if (window.location.pathname.includes('verify.html')) return;
            if (!verified || Date.now() - verifiedTime > EXPIRY) {
                window.location.href = 'verify.html';
            }
        })();

        document.getElementById('year').textContent = new Date().getFullYear();

        const clockDisplay = document.getElementById('clockDisplay');
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        let isAutoMode = true;
        let currentTheme = 'light';
        let savedThemeMode = 'auto';
        let timeThemeTimer = null;

        function getThemeByHour() {
            const h = new Date().getHours();
            return (h >= 6 && h < 18) ? 'light' : 'dark';
        }

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            toggle.textContent = theme === 'dark' ? '🌙' : '☀️';
            currentTheme = theme;
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('webSettings');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    savedThemeMode = parsed.theme || 'auto';
                } catch {
                    savedThemeMode = 'auto';
                }
            } else {
                savedThemeMode = 'auto';
            }
            return savedThemeMode;
        }

        function applyThemeFromMode(mode) {
            if (mode === 'auto') {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            } else if (mode === 'time') {
                applyTheme(getThemeByHour());
                isAutoMode = false;
                startTimeThemeTimer();
            } else if (mode === 'light' || mode === 'dark') {
                applyTheme(mode);
                isAutoMode = false;
                stopTimeThemeTimer();
            } else {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            }
        }

        function startTimeThemeTimer() {
            stopTimeThemeTimer();
            timeThemeTimer = setInterval(() => {
                const target = getThemeByHour();
                if (target !== currentTheme) {
                    applyTheme(target);
                }
            }, 60000);
        }

        function stopTimeThemeTimer() {
            if (timeThemeTimer) {
                clearInterval(timeThemeTimer);
                timeThemeTimer = null;
            }
        }

        function initTheme() {
            const mode = loadSavedTheme();
            applyThemeFromMode(mode);
        }

        clockDisplay.addEventListener('dblclick', function() {
            savedThemeMode = 'auto';
            localStorage.setItem('webSettings', JSON.stringify({ theme: 'auto' }));
            applyThemeFromMode('auto');
        });

        toggle.addEventListener('click', function() {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            savedThemeMode = next;
            localStorage.setItem('webSettings', JSON.stringify({ theme: next }));
            applyThemeFromMode(next);
        });

        if (window.matchMedia) {
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            media.addEventListener('change', function(e) {
                const mode = loadSavedTheme();
                if (mode === 'auto') {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'webSettings') {
                const mode = loadSavedTheme();
                applyThemeFromMode(mode);
            }
        });

        initTheme();

        function updateClockDisplay() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clockDisplay.textContent = h + ':' + m + ':' + s;
        }
        updateClockDisplay();
        setInterval(updateClockDisplay, 1000);
    </script>

</body>
