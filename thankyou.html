<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>致谢 · Grass114</title>
    <style>
        :root {
            --bg: #050508;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 40%);
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            pointer-events: none;
        }

        header {
            width: 100%;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .clock-wrapper {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clock-dot {
            width: 6px; height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 50px 60px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 40px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .thanks-icon { font-size: 48px; display: block; margin-bottom: 24px; }
        .thanks-sub { font-size: 16px; color: #cccccc; margin-bottom: 32px; }
        .thanks-sub strong { color: var(--text-main); }

        .thanks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .thanks-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.02);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            transition: border-color 0.2s, background 0.2s;
            text-align: left;
        }

        .thanks-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .thanks-card .avatar {
            width: 48px; height: 48px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--card-border);
            background: #000;
        }

        .info { display: flex; flex-direction: column; align-items: flex-start; }
        .info .name { font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
        .info .badge {
            font-size: 12px;
            font-family: var(--font-mono);
            color: #ff8fa3;
            background: rgba(255, 143, 163, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .empty-state {
            padding: 24px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 40px;
            background: rgba(0,0,0,0.2);
        }

        .back-btn {
            display: inline-flex;
            padding: 12px 32px;
            background: var(--text-main);
            color: var(--bg);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,255,255,0.15); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 768px) {
            header { padding: 24px; }
            main { padding: 0 24px 40px; }
            .content-card { padding: 24px; }
            .thanks-card { padding: 12px 16px; }
            .thanks-card .avatar { width: 40px; height: 40px; }
            .info .name { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="grid-overlay"></div>

    <header>
        <a href="index.html" class="logo">Grass114</a>
        <div class="clock-wrapper">
            <div class="clock-dot"></div>
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <main>
        <h1 class="page-title">致谢 / THANKS</h1>
        <div class="content-card">
            <span class="thanks-icon">🙏</span>
            <p class="thanks-sub">
                感谢每一位帮助过 <strong>Grass114</strong> 的人。
            </p>

            <div class="thanks-list">
                <div class="thanks-card">
                    <img class="avatar" src="huise25.jpg" alt="huise25" />
                    <div class="info">
                        <span class="name">huise25</span>
                        <span class="badge">❤️ 感谢支持</span>
                    </div>
                </div>
            </div>

            <div class="empty-state">
                🌱 如果你曾帮助过我，欢迎告诉我，我会把你写在这里 ❤️
            </div>

            <a href="index.html" class="back-btn">← 返回首页</a>
        </div>
    </main>

    <script>
        const clock = document.getElementById('clock');
        setInterval(() => {
            const now = new Date();
            clock.textContent = 
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
