<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>致谢 · BlueCat114</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #e6edf7 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.4s ease;
        }

        [data-theme="dark"] body {
            background: linear-gradient(145deg, #0f1724 0%, #1a2332 100%);
        }

        /* ===== 导航条（实色） ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            padding: 12px 28px;
            background: #ffffff;
            border-bottom: 1px solid #e9edf2;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        [data-theme="dark"] .top-bar {
            background: #1a2332;
            border-bottom: 1px solid #2a3a4a;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar .site-title {
            font-size: 18px;
            font-weight: 600;
            color: #0b1e33;
            text-decoration: none;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        [data-theme="dark"] .top-bar .site-title {
            color: #e2e8f0;
        }

        .top-bar .site-title:hover {
            color: #6c63ff;
        }

        .top-bar .site-title::before {
            content: "🏠";
            font-size: 20px;
        }

        .top-bar .nav-link {
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            text-decoration: none;
            transition: color 0.2s;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        [data-theme="dark"] .top-bar .nav-link {
            color: #cbd5e1;
        }

        .top-bar .nav-link::before {
            content: "｜";
            margin-right: 10px;
            color: #94a3b8;
            font-weight: 300;
        }

        .top-bar .nav-link:hover {
            color: #6c63ff;
            border-bottom-color: #6c63ff;
        }

        .top-bar .nav-link.active {
            color: #6c63ff;
            border-bottom-color: #6c63ff;
        }

        .clock-display {
            font-size: 16px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s;
            cursor: default;
            user-select: none;
            min-width: 80px;
            text-align: right;
        }

        [data-theme="dark"] .clock-display {
            color: #94a3b8;
        }

        .clock-display:hover {
            color: #6c63ff;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: background 0.3s;
            color: #0b1e33;
            background: #f1f4f9;
            border: 1px solid #e2e8f0;
            line-height: 1;
        }

        [data-theme="dark"] .theme-toggle {
            color: #e2e8f0;
            background: #2a3a4a;
            border: 1px solid #3a4a5a;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: scale(1.1);
        }

        /* ===== 主内容 ===== */
        .main {
            flex: 1;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding: 90px 28px 40px 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .thanks-content {
            text-align: center;
        }

        .thanks-icon {
            font-size: 72px;
            display: block;
            margin-bottom: 16px;
        }

        .thanks-title {
            font-size: 32px;
            font-weight: 700;
            color: #0b1e33;
            letter-spacing: -0.3px;
            transition: color 0.4s;
            margin-bottom: 12px;
        }

        [data-theme="dark"] .thanks-title {
            color: #e2e8f0;
        }

        .thanks-sub {
            font-size: 17px;
            color: #64748b;
            line-height: 1.8;
            transition: color 0.4s;
            margin-bottom: 28px;
        }

        [data-theme="dark"] .thanks-sub {
            color: #94a3b8;
        }

        .thanks-sub .highlight {
            color: #6c63ff;
            font-weight: 600;
        }

        /* ===== 致谢卡片列表 ===== */
        .thanks-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
        }

        .thanks-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 14px 24px 14px 16px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 16px rgba(0, 20, 40, 0.06);
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .thanks-card {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(71, 85, 105, 0.4);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .thanks-card:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 28px rgba(0, 20, 40, 0.12);
            border-color: rgba(108, 99, 255, 0.2);
        }

        [data-theme="dark"] .thanks-card:hover {
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
            border-color: rgba(129, 140, 248, 0.2);
        }

        .thanks-card .avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            flex-shrink: 0;
            object-fit: cover;
            border: 2px solid #e2e8f0;
            background: #f1f4f9;
        }

        [data-theme="dark"] .thanks-card .avatar {
            border-color: #3a4a5a;
            background: #1e293b;
        }

        .thanks-card .info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .thanks-card .name {
            font-size: 16px;
            font-weight: 600;
            color: #0b1e33;
            transition: color 0.4s;
        }

        [data-theme="dark"] .thanks-card .name {
            color: #e2e8f0;
        }

        .thanks-card .badge {
            font-size: 11px;
            font-weight: 500;
            color: #6c63ff;
            background: rgba(108, 99, 255, 0.10);
            padding: 1px 12px;
            border-radius: 30px;
            margin-top: 2px;
        }

        [data-theme="dark"] .thanks-card .badge {
            color: #818cf8;
            background: rgba(129, 140, 248, 0.12);
        }

        .empty-state {
            margin-top: 24px;
            padding: 20px 24px;
            background: rgba(108, 99, 255, 0.06);
            border-radius: 16px;
            border: 1px dashed rgba(108, 99, 255, 0.2);
            font-size: 15px;
            color: #64748b;
            transition: background 0.4s, border-color 0.4s, color 0.4s;
        }

        [data-theme="dark"] .empty-state {
            background: rgba(108, 99, 255, 0.08);
            border-color: rgba(108, 99, 255, 0.15);
            color: #94a3b8;
        }

        .empty-state .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            padding: 24px 0 28px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            transition: color 0.4s, border-color 0.4s;
        }

        [data-theme="dark"] .footer {
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer a {
            color: #6c63ff;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .main {
                padding: 80px 18px 30px 18px;
            }
            .thanks-icon {
                font-size: 56px;
            }
            .thanks-title {
                font-size: 26px;
            }
            .thanks-sub {
                font-size: 15px;
            }
            .thanks-card {
                padding: 12px 18px 12px 12px;
                gap: 12px;
            }
            .thanks-card .avatar {
                width: 40px;
                height: 40px;
                border-radius: 10px;
            }
            .thanks-card .name {
                font-size: 14px;
            }
            .top-bar {
                padding: 10px 18px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .top-bar .site-title {
                font-size: 16px;
            }
            .top-bar .nav-link {
                font-size: 14px;
            }
            .clock-display {
                font-size: 14px;
                min-width: 70px;
            }
            .theme-toggle {
                font-size: 18px;
                padding: 3px 6px;
            }
            .empty-state {
                font-size: 14px;
                padding: 16px 18px;
            }
        }

        @media (max-width: 400px) {
            .main {
                padding: 72px 14px 24px 14px;
            }
            .thanks-icon {
                font-size: 44px;
            }
            .thanks-title {
                font-size: 22px;
            }
            .thanks-sub {
                font-size: 14px;
            }
            .thanks-card {
                padding: 10px 14px 10px 10px;
                gap: 10px;
                border-radius: 40px;
            }
            .thanks-card .avatar {
                width: 34px;
                height: 34px;
                border-radius: 8px;
            }
            .thanks-card .name {
                font-size: 13px;
            }
            .thanks-card .badge {
                font-size: 10px;
                padding: 0 10px;
            }
            .top-bar {
                padding: 8px 12px;
            }
            .top-bar .site-title {
                font-size: 14px;
            }
            .top-bar .nav-link {
                font-size: 12px;
            }
            .top-bar .nav-link::before {
                margin-right: 4px;
            }
            .clock-display {
                font-size: 12px;
                min-width: 60px;
            }
            .theme-toggle {
                font-size: 16px;
                padding: 2px 5px;
            }
            .empty-state {
                font-size: 13px;
                padding: 14px 14px;
            }
            .footer {
                font-size: 12px;
                padding: 18px 0 20px 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 导航条 ===== -->
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="site-title">BlueCat114 官方网站</a>
            <a href="project.html" class="nav-link">项目</a>
            <a href="game.html" class="nav-link">网页游戏</a>
            <a href="thankyou.html" class="nav-link active">致谢</a>
            <a href="about.html" class="nav-link">关于我</a>
            <a href="settings.html" class="nav-link">设置</a>
        </div>
        <div class="top-bar-right">
            <div class="clock-display" id="clockDisplay" title="双击恢复自动模式">--:--:--</div>
            <button class="theme-toggle" id="themeToggle" aria-label="切换暗色/亮色模式">☀️</button>
        </div>
    </div>

    <!-- ===== 主要内容 ===== -->
    <div class="main">

        <div class="thanks-content">
            <span class="thanks-icon">🙏</span>
            <h1 class="thanks-title">致谢</h1>
            <p class="thanks-sub">
                感谢每一位帮助过 <span class="highlight">BlueCat114</span> 的人。
            </p>

            <!-- ===== 致谢人列表 ===== -->
            <div class="thanks-list">

                <!-- huise25 -->
                <div class="thanks-card">
                    <img class="avatar" src="huise25.jpg" alt="huise25" />
                    <div class="info">
                        <span class="name">huise25</span>
                        <span class="badge">❤️ 感谢支持</span>
                    </div>
                </div>

            </div>

            <!-- 空状态提示 -->
            <div class="empty-state">
                <span class="emoji">🌱</span>
                如果你曾帮助过我，欢迎告诉我，我会把你写在这里 ❤️
            </div>
        </div>

        <!-- ===== 页脚 ===== -->
        <div class="footer">
            © <span id="year"></span> <a href="https://github.com/grass114">BlueCat114</a> · 用 ❤️ 和 ☕ 打造
        </div>

    </div>

    <!-- ===== 小宠物（由设置页控制显示） ===== -->
    <script src="pet-loader.js"></script>

    <script>
        // ===== 年份自动更新 =====
        document.getElementById('year').textContent = new Date().getFullYear();

        // ============================================================
        //  统一的主题控制（读取 localStorage + 时间自动模式）
        // ============================================================
        const clockDisplay = document.getElementById('clockDisplay');
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        let isAutoMode = true;
        let currentTheme = 'light';
        let savedThemeMode = 'auto';
        let timeThemeTimer = null;

        function getThemeByHour() {
            const h = new Date().getHours();
            return (h >= 6 && h < 18) ? 'light' : 'dark';
        }

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            toggle.textContent = theme === 'dark' ? '🌙' : '☀️';
            currentTheme = theme;
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('webSettings');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    savedThemeMode = parsed.theme || 'auto';
                } catch {
                    savedThemeMode = 'auto';
                }
            } else {
                savedThemeMode = 'auto';
            }
            return savedThemeMode;
        }

        function applyThemeFromMode(mode) {
            if (mode === 'auto') {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            } else if (mode === 'time') {
                applyTheme(getThemeByHour());
                isAutoMode = false;
                startTimeThemeTimer();
            } else if (mode === 'light' || mode === 'dark') {
                applyTheme(mode);
                isAutoMode = false;
                stopTimeThemeTimer();
            } else {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(isDark ? 'dark' : 'light');
                isAutoMode = true;
                stopTimeThemeTimer();
            }
        }

        function startTimeThemeTimer() {
            stopTimeThemeTimer();
            timeThemeTimer = setInterval(() => {
                const target = getThemeByHour();
                if (target !== currentTheme) {
                    applyTheme(target);
                }
            }, 60000);
        }

        function stopTimeThemeTimer() {
            if (timeThemeTimer) {
                clearInterval(timeThemeTimer);
                timeThemeTimer = null;
            }
        }

        function initTheme() {
            const mode = loadSavedTheme();
            applyThemeFromMode(mode);
        }

        // 双击时钟恢复自动模式
        clockDisplay.addEventListener('dblclick', function() {
            savedThemeMode = 'auto';
            localStorage.setItem('webSettings', JSON.stringify({ theme: 'auto' }));
            applyThemeFromMode('auto');
        });

        // 手动切换主题
        toggle.addEventListener('click', function() {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            savedThemeMode = next;
            localStorage.setItem('webSettings', JSON.stringify({ theme: next }));
            applyThemeFromMode(next);
        });

        // 监听系统主题变化
        if (window.matchMedia) {
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            media.addEventListener('change', function(e) {
                const mode = loadSavedTheme();
                if (mode === 'auto') {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        }

        // 监听 localStorage 变化（跨标签页同步）
        window.addEventListener('storage', function(e) {
            if (e.key === 'webSettings') {
                const mode = loadSavedTheme();
                applyThemeFromMode(mode);
            }
        });

        // 初始化
        initTheme();

        function updateClockDisplay() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clockDisplay.textContent = h + ':' + m + ':' + s;
        }
        updateClockDisplay();
        setInterval(updateClockDisplay, 1000);
    </script>

</body>
</html>
